name: flow-pilot-action
description: flow-pilot-action
author: TDesign
inputs:
  token:
    description: personal access token
  packages:
    description: packages
  pr_number:
    description: pr id
  translate-secret-id:
    description: translate secret id
    required: false
  translate-secret-key:
    description: translate secret key
    required: false
  mode:
    description: 仓库模式;`single` 为单仓(自动从 tag 区间 PR 抓取日志,使用纯版本号 git tag);`monorepo` 为 monorepo(glob 自动发现包,使用 `.changelog/` 暂存)。默认 `monorepo`
    required: false
    default: monorepo
  package-json-path:
    description: 单仓模式下指定 package.json 路径(相对于仓库根目录),默认读取根目录 package.json
    required: false
  changelog-path:
    description: 单仓模式下指定 CHANGELOG.md 路径,默认在包目录下读写 CHANGELOG.md / CHANGELOG.en-US.md
    required: false
  from-tag:
    description: 覆盖日志区间起始 tag(默认选择目标 ref 可达的最近 tag;无 tag 时扫描全部历史)
    required: false
  to-tag:
    description: 覆盖日志区间结束 ref(默认取 release PR 的 base 分支)
    required: false

outputs:
  changelog:
    description: changelog
runs:
  using: node24
  main: dist/index.mjs
